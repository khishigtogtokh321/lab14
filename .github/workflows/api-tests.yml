# Workflow-ийн нэр
name: API tests

# Хэзээ ажиллах нөхцөл
on: [push, pull_request]

jobs:
  newman:
    # Ажиллах орчин
    runs-on: ubuntu-latest
    
    steps:
    # 1. Кодыг татаж авах
    - name: Checkout repository
      uses: actions/checkout@v4

    # Java суулгах (Spring Boot-д хэрэгтэй)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # 2. Node.js суулгах
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # 3. Newman болон нэмэлт хэрэгслүүдийг суулгах
    - name: Install Newman
      run: npm install -g newman newman-reporter-htmlextra

    # Серверээ асаах
    - name: Build and Start Spring Boot App
      run: |
        mvn clean package -DskipTests
        nohup java -jar target/*.jar > app.log 2>&1 &
        echo "Waiting for app to start..."
        sleep 20
        curl -v http://localhost:8080/api/products || true

    # 4. Newman тестүүдийг ажиллуулах
    - name: Run API tests
      run: |
        mkdir -p reports
        newman run postman/collection.json \
        -e postman/env.ci.json \
        --reporters cli,htmlextra \
        --reporter-htmlextra-export reports/api.html

    # 5. Тестийн тайланг файл хэлбэрээр хадгалах
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always() # Тест амжилтгүй болсон ч тайланг татаж авах боломжтой байлгах
      with:
        name: api-test-report
        path: reports/
