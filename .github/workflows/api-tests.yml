# Workflow-ийн нэр
name: API tests

# Хэзээ ажиллах нөхцөл
on: [push, pull_request]

jobs:
  newman:
    # Ажиллах орчин
    runs-on: ubuntu-latest
    
    steps:
    # 1. Кодыг татаж авах
    - name: Checkout repository
      uses: actions/checkout@v6

    # Java суулгах (Spring Boot-д хэрэгтэй)
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # 2. Node.js суулгах
    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    # 3. Newman болон нэмэлт хэрэгслүүдийг суулгах
    - name: Install Newman
      run: npm install -g newman newman-reporter-htmlextra

    # Серверээ асаах
    - name: Build and Start Spring Boot App
      run: |
        mvn clean package -DskipTests
        nohup java -jar target/*.jar > app.log 2>&1 &
        echo "Waiting for app to start..."
        for i in {1..45}; do
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/products || true)
          if [ "$status" != "000" ]; then
            echo "App is ready with HTTP $status"
            exit 0
          fi
          sleep 1
        done
        echo "App did not start in time"
        cat app.log
        exit 1

    # 4. Newman тестүүдийг ажиллуулах
    - name: Run API tests
      run: |
        mkdir -p reports
        newman run postman/collection.json \
        -e postman/env.ci.json \
        --reporters cli,htmlextra \
        --reporter-htmlextra-export reports/api.html

    # 5. Тестийн тайланг файл хэлбэрээр хадгалах
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      if: always() # Тест амжилтгүй болсон ч тайланг татаж авах боломжтой байлгах
      with:
        name: api-test-report
        path: reports/
