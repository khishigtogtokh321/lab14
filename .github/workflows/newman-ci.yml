name: API Tests with Newman

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          
      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
          
      - name: Build and Start Spring Boot App
        run: |
          mvn clean package -DskipTests
          nohup java -jar target/*.jar > app.log 2>&1 &
          
      - name: Wait for App to Start
        run: |
          echo "Waiting for app to start..."
          for i in {1..45}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/products || true)
            if [ "$status" != "000" ]; then
              echo "App is ready with HTTP $status"
              exit 0
            fi
            sleep 1
          done
          echo "App did not start in time"
          cat app.log
          exit 1
          
      - name: Run Postman Tests
        run: |
          mkdir -p newman
          newman run postman/Lab12_Collection.json \
            -e postman/Lab12_Environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/report.html
            
      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: newman-report
          path: newman/report.html
