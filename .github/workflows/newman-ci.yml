name: API Tests with Newman

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
          
      - name: Build and Start Spring Boot App
        run: |
          mvn clean package -DskipTests
          nohup java -jar target/*.jar > app.log 2>&1 &
          
      - name: Wait for App to Start
        run: |
          echo "Waiting for app to start..."
          sleep 20
          curl -v http://localhost:8080/api/products || echo "App might not be up yet, but moving on..."
          
      - name: Run Postman Tests
        run: |
          newman run postman/Lab12_Collection.json \
            -e postman/Lab12_Environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/report.html
            
      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: newman-report
          path: newman/report.html
